[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "HashShield"
version = "1.3.0"
description = "A hybrid malware scanner using local signatures and VirusTotal."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohttp",
    "python-dotenv",
    "tqdm",
    "colorama",
    "yara-python",
]

[project.scripts]
hashshield = "scanner:main"
hashshield-agent = "agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["agent"]